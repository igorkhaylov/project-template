# Dependabot: weekly update PRs per ecosystem, minor+patch grouped into one PR each so the
# noise stays low; majors arrive as separate PRs. CI runs on every PR (backend.yml /
# frontend.yml), so a green PR is safe to merge. Security advisories additionally open
# PRs as soon as they are published (Dependabot alerts are enabled on the repository).
#
# Cooldown (uv, npm): a release is proposed only once it is 7 days old. Most hijacked or
# broken releases are yanked within days, so the wait keeps them out of the lockfiles;
# Dependabot's own default is 3 days. It applies to version updates only — a security
# update for a published advisory is never delayed by it.
#
# What Dependabot cannot do here: the backend runs lockfile-only (below), so a fix that
# needs a version cap raised in pyproject.toml never arrives as a PR. The daily Audit
# workflow (.github/workflows/audit.yml) is the backstop: it fails on a known
# vulnerability in whatever the lockfiles pin, whatever the reason it is still pinned.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    # Update uv.lock only, never the version constraints in pyproject.toml: the caps there
    # are deliberate (Django LTS line, redis bounded by kombu). Without this Dependabot
    # widened the redis cap and pulled a kombu pre-release to satisfy it.
    versioning-strategy: lockfile-only
    cooldown:
      default-days: 7
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Django stays on the 5.2 LTS line until 6.2 LTS.
      - dependency-name: django
        update-types: ["version-update:semver-major"]
      # A redis-py major is a deliberate change of its own (kombu 5.7 accepts redis<9).
      - dependency-name: redis
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # openapi-typescript 7 requires typescript ^5 (typescript-eslint already accepts 6.0);
      # TypeScript 7 is supported by neither yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Interpreter/runtime lines are deliberate decisions, not routine updates.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /ops/compose
    schedule:
      interval: weekly
      day: monday
    ignore:
      # A Postgres major is a data migration; minors (security fixes) are welcome.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
      # db-backup stays on the last 4.x release (the one that wraps pg_dump); 5.x is a
      # rewrite with its own dump engine — a decision, not an update (docs/backup.md).
      - dependency-name: "*db-backup*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
