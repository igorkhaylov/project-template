name: Deploy

# SSH-based deploy from a GitHub-hosted runner to a Docker Compose host. The SERVER
# logs in to GHCR, pins the new image(s) in its ./.env and runs
# ops/scripts/deploy.sh — pull + `up -d`, which recreates only the services whose image
# changed. A backend deploy never restarts the frontend container and vice versa.
#
# Triggers
#   * automatically after "Backend" or "Frontend" succeeds on master — deploys ONLY the
#     component that was just built, pinned to its sha-<full-sha> — but only when the
#     repository variable AUTO_DEPLOY is "true" (opt-in; the bare template skips it).
#   * manually (workflow_dispatch): choose the environment and a tag per component;
#     leave a tag empty to keep what the server currently pins.
#
# Trust boundary. This job holds the production SSH key, so nothing that comes from the
# event is trusted as-is:
#   * the automatic trigger only accepts runs of THIS repository started by a push or a
#     manual dispatch. `workflow_run` also fires for pull requests, and its `branches:`
#     filter matches the HEAD branch name — a fork PR from a branch called `master`
#     would otherwise reach this job;
#   * tags and the commit SHA are passed to the scripts through the environment (an
#     `${{ }}` expression inside `run:` is pasted into the script as code) and are
#     checked against a strict format before the SSH step; ops/scripts/deploy.sh
#     validates the full image reference again on the server.
#
# Per-environment secrets live in GitHub Environments (prod / dev):
#   SSH_HOST  SSH_USER  SSH_PORT  SSH_KEY   — connection (dedicated deploy keypair)
#   SSH_FINGERPRINT                         — server host-key SHA256 (host-key pinning)
#   DEPLOY_PATH                             — path to the repo checkout on the server
#   GHCR_USER  GHCR_PAT                     — GitHub user + PAT with `read:packages` only
#
# The server holds a git checkout at DEPLOY_PATH (compose files, nginx edge config,
# scripts) and its own ./.env (provisioned out-of-band; CI never writes it).

on:
  workflow_run:
    workflows: ["Backend", "Frontend"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [prod, dev]
        default: prod
      backend_tag:
        description: "Backend image tag (latest, vX.Y.Z or sha-<full-sha>); empty = unchanged"
        default: ""
      frontend_tag:
        description: "Frontend image tag (latest, vX.Y.Z or sha-<full-sha>); empty = unchanged"
        default: ""

permissions:
  contents: read

# Never let two deploys to the same environment overlap. Queue instead of cancel.
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.AUTO_DEPLOY == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'prod' }}
    steps:
      - name: Resolve what to deploy
        id: plan
        shell: bash
        env:
          LC_ALL: C
          EVENT_NAME: ${{ github.event_name }}
          RUN_WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          INPUT_BACKEND_TAG: ${{ inputs.backend_tag }}
          INPUT_FRONTEND_TAG: ${{ inputs.frontend_tag }}
        run: |
          set -euo pipefail
          backend_tag="" frontend_tag=""
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            sha="$RUN_SHA"
            case "$RUN_WORKFLOW" in
              Backend)  backend_tag="sha-$sha" ;;
              Frontend) frontend_tag="sha-$sha" ;;
              *) echo "::error::Triggered by an unexpected workflow."; exit 1 ;;
            esac
          else
            sha="$DISPATCH_SHA"
            backend_tag="$INPUT_BACKEND_TAG"
            frontend_tag="$INPUT_FRONTEND_TAG"
          fi

          # Validate BEFORE anything is written to $GITHUB_OUTPUT or sent to the server.
          # The rejected value is never echoed: it is attacker-controlled text.
          sha_re='^[0-9a-f]{40}$'
          tag_re='^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'   # the Docker tag grammar
          [[ "$sha" =~ $sha_re ]] || { echo "::error::The commit to deploy is not a full 40-character SHA."; exit 1; }
          for name in backend_tag frontend_tag; do
            value="${!name}"
            if [ -n "$value" ] && ! [[ "$value" =~ $tag_re ]]; then
              echo "::error::$name is not a valid image tag (allowed: letters, digits, '_', '.', '-'; at most 128 characters)."
              exit 1
            fi
          done

          {
            echo "backend_tag=$backend_tag"
            echo "frontend_tag=$frontend_tag"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          # Host-key pinning (recommended). Leave the secret unset only if you accept TOFU.
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          envs: GHCR_USER,GHCR_PAT,DEPLOY_PATH,DEPLOY_SHA,IMAGE_REPO,BACKEND_TAG,FRONTEND_TAG
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            # Sync compose files, nginx edge config and scripts to the deployed commit
            # (./.env is gitignored and untouched). No `git clean`: it would delete .env.
            git fetch --all --prune
            git reset --hard "$DEPLOY_SHA"

            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Docker refs must be lowercase (github.repository may contain uppercase).
            IMAGE_REPO=$(echo "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]')
            # Arguments are built as a list and passed quoted, never as a string that the
            # shell re-splits. deploy.sh validates each image reference before using it.
            set --
            [ -z "$BACKEND_TAG" ]  || set -- "$@" --backend  "ghcr.io/$IMAGE_REPO/backend:$BACKEND_TAG"
            [ -z "$FRONTEND_TAG" ] || set -- "$@" --frontend "ghcr.io/$IMAGE_REPO/frontend:$FRONTEND_TAG"
            ./ops/scripts/deploy.sh "$@"

            docker logout ghcr.io
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ steps.plan.outputs.sha }}
          IMAGE_REPO: ${{ github.repository }}
          BACKEND_TAG: ${{ steps.plan.outputs.backend_tag }}
          FRONTEND_TAG: ${{ steps.plan.outputs.frontend_tag }}

# ---------------------------------------------------------------------------------------
# OPTION: let CI write the server's .env from a secret (NOT the default — secrets then
# live in GitHub and are overwritten every deploy). Add a secret DOTENV with the full
# .env contents, add DOTENV to `envs:` above, and prepend to the script:
#
#   cd "$DEPLOY_PATH"
#   umask 077
#   printf '%s' "$DOTENV" > .env
#
# Prefer keeping .env on the server (the default above): fewer places hold secrets.
# ---------------------------------------------------------------------------------------
