name: Frontend

# Owned by the frontend team. Runs only when frontend-related paths change — including
# api/openapi.yaml, because a backend contract change must re-check the generated types.
#
#   check           npm ci, generated types in sync with api/openapi.yaml, lint,
#                   format check, typecheck, unit tests, production build
#   build-and-push  ghcr.io/<owner>/<repo>/frontend (same tag scheme as the backend)

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "frontend/**"
      - "api/openapi.yaml"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "api/openapi.yaml"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # src/shared/api/schema.d.ts is committed so the Docker build (context = frontend/) and
      # editors work without the backend; it must match api/openapi.yaml.
      - name: Check generated API types are up to date
        run: |
          npm run api:types
          if ! git diff --exit-code -- src/shared/api/schema.d.ts; then
            echo "::error file=frontend/src/shared/api/schema.d.ts::Generated types are stale. Run 'make api-schema' (or 'npm run api:types') and commit."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  build-and-push:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/frontend" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend             # self-contained: the image never reads outside frontend/
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
