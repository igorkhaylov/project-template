name: Backend

# Owned by the backend team. Runs only when backend-related paths change (tag pushes
# ignore the path filter, so a `vX.Y.Z` tag builds every component).
#
#   test            pytest via ops/compose/docker-compose.test.yml, then verifies that
#                   api/openapi.yaml matches what the code generates (`make api-schema`)
#   build-and-push  ghcr.io/<owner>/<repo>/backend with tags:
#                     latest          default branch only
#                     sha-<full-sha>  every build (deploy pins THIS)
#                     vX.Y.Z / X.Y.Z  on a git tag push
#
# No secrets needed beyond the built-in GITHUB_TOKEN.

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "backend/**"
      - "api/openapi.yaml"
      - "ops/compose/docker-compose.test.yml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "api/openapi.yaml"
      - "ops/compose/docker-compose.test.yml"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  TEST_COMPOSE: docker compose --project-directory . -f ops/compose/docker-compose.test.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run test suite
        run: ${{ env.TEST_COMPOSE }} up --build --abort-on-container-exit --exit-code-from backend

      # The committed schema is the contract the frontend generates its types from. It
      # is rendered from the same test image (no .env, ENVIRONMENT=test) as `make
      # api-schema`, so the output is byte-for-byte reproducible.
      - name: Check api/openapi.yaml is up to date
        run: |
          ${{ env.TEST_COMPOSE }} run --rm --no-deps -T backend python manage.py spectacular --validate > /tmp/openapi.yaml
          if ! diff -u api/openapi.yaml /tmp/openapi.yaml; then
            echo "::error file=api/openapi.yaml::Schema is stale. Run 'make api-schema' and commit api/openapi.yaml + frontend/src/api/schema.d.ts."
            exit 1
          fi

      - name: Tear down
        if: always()
        run: ${{ env.TEST_COMPOSE }} down -v

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # github.repository keeps the owner/repo casing as typed on GitHub, but Docker
      # refs must be lowercase — lowercase it before it reaches the image name.
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/backend" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend              # self-contained: the image never reads outside backend/
          file: ./backend/Dockerfile      # prod image: multi-stage, no dev deps
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('sha-{0}', github.sha) }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
