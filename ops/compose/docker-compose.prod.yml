name: ${PROJECT_NAME:-project-template}

# Production deploy compose: PULL-ONLY. Both images come from the registry; nothing is
# built on the server. Pin exact builds in ./.env:
#   BACKEND_IMAGE=ghcr.io/<owner>/<repo>/backend:sha-<full-sha>
#   FRONTEND_IMAGE=ghcr.io/<owner>/<repo>/frontend:sha-<full-sha>
# A deploy of one component changes one variable; `up -d` recreates only the services
# whose image changed and leaves the other component running untouched.
#
# Files the server needs: this file + ./.env + ./ops/nginx/nginx.conf (+ the Makefile and
# ops/scripts/deploy.sh for convenience). Deploy: `make prod deploy` or
# `ops/scripts/deploy.sh --backend <image>` (what CI runs).


# Caps Docker's json-file logs so they can't fill the host disk (the default driver
# has NO rotation).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"


x-backend-defaults: &backend-defaults
  image: ${BACKEND_IMAGE:-ghcr.io/igorkhaylov/project-template/backend:latest}
  pull_policy: always
  env_file:
    - ./.env
  logging: *default-logging
  # Harmless no-op when DJANGO_MINIO_ENDPOINT points at managed S3; preserves the
  # "managed MinIO on the host" option if you ever reach storage via host.docker.internal.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped


services:
  # One-shot release step (migrate + collectstatic + first superuser) from the SAME
  # image as backend. `backend` only starts after it exits 0, so a failed migration
  # leaves the previous web containers serving. Idempotent: `make prod release` re-runs it.
  release:
    <<: *backend-defaults
    command: bash scripts/release.sh
    restart: "no"

  backend:
    <<: *backend-defaults
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      release:
        condition: service_completed_successfully
    expose:
      - 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/readyz/ || exit 1"]
      interval: 30s
      retries: 5
      start_period: 20s
      timeout: 3s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  celery:
    <<: *backend-defaults
    command: celery -A config worker --loglevel=INFO --concurrency=2 -Q celery
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  # Exactly ONE instance. Schedule in the DB (django-celery-beat): stateless container,
  # no volume, no healthcheck (nothing to probe; `restart` covers a dead process).
  celery-beat:
    <<: *backend-defaults
    command: celery -A config beat --loglevel=INFO
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/igorkhaylov/project-template/frontend:latest}
    pull_policy: always
    logging: *default-logging
    environment:
      # Runtime config rendered into /config.js by the image's nginx. Same image for
      # every environment; only these values differ.
      APP_API_BASE_URL: ${APP_API_BASE_URL:-}
      APP_ENVIRONMENT: ${ENVIRONMENT:-prod}
    expose:
      - 8080
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 first, and nginx
      # answers there only because the template also listens on [::]:8080.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      retries: 3
      start_period: 5s
      timeout: 3s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64m

  redis:
    image: redis:8
    logging: *default-logging
    # noeviction protects queued Celery messages from being dropped under memory pressure.
    command: redis-server --save 60 1 --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    expose:
      - 6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 5
      timeout: 3s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320m

  db:
    image: postgres:17.4
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 5
      timeout: 3s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  # Optional automated PostgreSQL backups (tiredofit/db-backup). DISABLED by default:
  # it only starts when the "backup" compose profile is active. Enable it by setting
  #   COMPOSE_PROFILES=backup
  # in ./.env (then `make prod deploy` picks it up). Scope: DATABASE ONLY. Media lives
  # in S3/MinIO — back that up with bucket versioning/replication and/or `make dump media`
  # (docs/backup.md). Target + schedule + retention are all set in .env.
  db-backup:
    image: ${DB_BACKUP_IMAGE:-ghcr.io/tiredofit/docker-db-backup:4.1.100}
    profiles: ["backup"]
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB01_TYPE: pgsql
      DB01_HOST: db
      DB01_PORT: "5432"
      DB01_NAME: ${POSTGRES_DB}
      DB01_USER: ${POSTGRES_USER}
      DB01_PASS: ${POSTGRES_PASSWORD}
      # Schedule + retention, in MINUTES. Defaults: back up every 24h, keep 7 days.
      DB01_BACKUP_INTERVAL: ${DB_BACKUP_INTERVAL:-1440}
      DB01_CLEANUP_TIME: ${DB_BACKUP_CLEANUP_TIME:-10080}
      DB01_COMPRESSION: ${DB_BACKUP_COMPRESSION:-ZSTD}
      # Where backups go: FILESYSTEM (default) or S3.
      DB01_BACKUP_LOCATION: ${DB_BACKUP_LOCATION:-FILESYSTEM}
      DB01_FILESYSTEM_PATH: /backup
      # S3 target (used only when DB_BACKUP_LOCATION=S3). A dedicated bucket/prefix,
      # independent of the app's DJANGO_MINIO_* media storage.
      DB01_S3_BUCKET: ${DB_BACKUP_S3_BUCKET:-}
      DB01_S3_PATH: ${DB_BACKUP_S3_PATH:-db-backups}
      DB01_S3_REGION: ${DB_BACKUP_S3_REGION:-us-east-1}
      DB01_S3_KEY_ID: ${DB_BACKUP_S3_KEY_ID:-}
      DB01_S3_KEY_SECRET: ${DB_BACKUP_S3_KEY_SECRET:-}
      DB01_S3_HOST: ${DB_BACKUP_S3_HOST:-}
    volumes:
      - ${DB_BACKUP_FS_PATH:-./db-backups}:/backup
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  # NOTE: object storage (MinIO / S3) is NOT part of this compose. In prod, point
  # DJANGO_MINIO_* at your managed MinIO / S3. Static and media are served from there,
  # so nginx needs NO static volume.

  nginx:
    image: nginx:stable-alpine
    logging: *default-logging
    ports:
      - "${APP_PORT:-8050}:80"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m


volumes:
  postgres-data:
  redis-data:
