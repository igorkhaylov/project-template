# The edge of the Compose stack: ONE public port, two upstreams.
#
#   backend-owned prefixes  -> gunicorn (backend:8000)
#   everything else         -> the SPA image (frontend:8080)
#
# In Kubernetes this file has no equivalent container: the Ingress carries the same
# two rules (ops/k8s/README.md). Keep the prefix list in sync with
# backend/config/urls.py and frontend/vite.config.ts.
#
# An EXTERNAL reverse proxy (TLS termination) sits in front of this port. It sets
# X-Forwarded-Proto; this file must NOT re-set it (that would overwrite the edge's value
# and create a redirect loop under SECURE_SSL_REDIRECT).

user nginx;
worker_processes auto;

pid /run/nginx.pid;


events {
    worker_connections 4096;
    multi_accept on;
}


http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_authorization $auth_present {
        default "present";
        "" "absent";
    }

    # === Request ID ===
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        "" "$msec-$pid-$connection-$request_length";
    }
    proxy_set_header X-Request-ID $req_id;
    add_header X-Request-ID $req_id always;

    # escape=json so special characters cannot break the JSON line
    log_format json_main escape=json
    '{'
    '"@timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"x_forwarded_for":"$http_x_forwarded_for",'
    '"request_id":"$req_id",'
    '"auth_present":"$auth_present",'
    '"request_method":"$request_method",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"bytes_sent":$bytes_sent,'
    '"referer":"$http_referer",'
    '"ua":"$http_user_agent",'
    '"scheme":"$scheme",'
    '"protocol":"$server_protocol",'
    '"host":"$host",'
    '"uri":"$uri",'
    '"args":"$args",'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time"'
    '}';

    access_log /dev/stdout json_main;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    # Docker Compose: use the embedded DNS and re-resolve upstreams (containers get new
    # IPs on recreate). Not needed in Kubernetes — the Ingress replaces this file.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    # === UPSTREAMS ===
    upstream django {
        zone django_zone 64k;
        server backend:8000 resolve max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream spa {
        zone spa_zone 64k;
        server frontend:8080 resolve max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Upgrade/Connection handling for WebSockets (used by the optional /ws/ block).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        location ~ /\. {
            deny all;
        }

        # ---------------------------------------------------------------------------
        # Backend-owned paths: /api/, /admin/ (+ language prefix), /rosetta/,
        # /__debug__/ (dev only), /healthz/, /readyz/.
        # ---------------------------------------------------------------------------
        location ~ ^/((en|ru)/)?(api|admin|rosetta|__debug__|healthz|readyz)(/|$) {
            client_max_body_size 500M;

            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";   # keep upstream connections alive

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # --- X-Forwarded-Proto is set ONLY by the external TLS proxy --- #
            # proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            proxy_pass http://django;
        }

        # # WebSocket endpoint (Django Channels / ASGI): uncomment and add "ws" to the
        # # prefix lists in backend/config/urls.py and frontend/vite.config.ts.
        # location /ws/ {
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection $connection_upgrade;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_buffering off;
        #     proxy_connect_timeout 5s;
        #     proxy_send_timeout 600s;
        #     proxy_read_timeout 600s;
        #     proxy_pass http://django;
        # }

        # ---------------------------------------------------------------------------
        # Everything else is the SPA (its own nginx does the history fallback and
        # serves /config.js from env).
        # ---------------------------------------------------------------------------
        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;

            proxy_pass http://spa;
        }
    }
}
