# Development edge. Same routing as nginx.conf, but `/` goes to the Vite dev server
# running ON THE HOST (`make fe-dev`, port 5173), including its HMR WebSocket. If Vite
# is not running, `/` answers 502 while the API keeps working — expected.

user nginx;
worker_processes auto;

pid /run/nginx.pid;


events {
    worker_connections 1024;
}


http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_x_request_id $req_id {
        default $http_x_request_id;
        "" "$msec-$pid-$connection-$request_length";
    }
    proxy_set_header X-Request-ID $req_id;
    add_header X-Request-ID $req_id always;

    log_format dev_main '$remote_addr "$request" $status $body_bytes_sent '
                        '$request_time "$upstream_addr" req=$req_id';
    access_log /dev/stdout dev_main;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    upstream django {
        zone django_zone 64k;
        server backend:8000 resolve max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # host.docker.internal comes from /etc/hosts (extra_hosts), which the `resolve`
    # parameter would bypass — so this upstream is resolved once at startup.
    upstream vite {
        server host.docker.internal:5173;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        location ~ /\. {
            deny all;
        }

        # Keep in sync with backend/config/urls.py and frontend/vite.config.ts.
        location ~ ^/((en|ru)/)?(api|admin|rosetta|__debug__|healthz|readyz)(/|$) {
            client_max_body_size 500M;

            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 2s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_pass http://django;
        }

        # Vite dev server + HMR websocket.
        location / {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_pass http://vite;
        }
    }
}
